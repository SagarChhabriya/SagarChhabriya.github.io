# GitHub Pages for this repo is configured to deploy from the main branch root
# (static index.html + style.css). No build step is required.
#
# This workflow is intentionally a no-op placeholder so older Action-based
# deploys do not overwrite the branch-deployed static site with a Vite dist
# that Pages settings may not be using.
#
# To re-enable Vite builds later:
# 1. Repo Settings → Pages → Source = "GitHub Actions"
# 2. Restore a build + actions/deploy-pages job here

name: Pages note

on:
  workflow_dispatch:

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - name: Static site
        run: echo "Site is served as static files from the main branch root."
